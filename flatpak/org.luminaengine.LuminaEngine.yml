app-id: org.luminaengine.LuminaEngine
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.cmake
command: LuminaEngineExample

finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  # Lua 5.4
  - name: lua
    buildsystem: simple
    build-commands:
      - make linux
      - make install INSTALL_TOP=/app
    sources:
      - type: git
        url: https://github.com/lua/lua.git
        tag: v5.4.6

  # SDL3 (Recent Preview version required by the engine)
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_SHARED=ON
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_DISABLE_INSTALL_DOCS=ON
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: preview-3.1.3

  # Box2D 2.4.1
  - name: box2d
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBOX2D_BUILD_UNIT_TESTS=OFF
      - -DBOX2D_BUILD_TESTBED=OFF
    sources:
      - type: git
        url: https://github.com/erincatto/box2d.git
        tag: v2.4.1

  # Sol2 (Header-only)
  - name: sol2
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/ThePhD/sol2.git
        tag: v3.3.0
    build-commands:
      - mkdir -p /app/include
      - cp -r include/sol /app/include/

  - name: lumina-engine
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DLUMINA_USE_SYSTEM_SOL2=ON
      - -DLUMINA_BUILD_EXAMPLES=ON
    sources:
      - type: git
        url: https://github.com/lumina-engine/lumina-engine.git
        tag: v1.0.0

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /include/sol2
  - /usr/share/doc
  - /usr/share/man
  - /lib/*.a
