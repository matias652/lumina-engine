name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build pkg-config liblua5.4-dev libbox2d-dev

    - name: Install SDL3
      run: |
        git clone --depth 1 https://github.com/libsdl-org/SDL.git
        cd SDL
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel
        sudo cmake --install build

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      env:
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    - name: Build
      run: cmake --build build --parallel

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install cmake ninja lua

    - name: Install SDL3
      run: |
        git clone --depth 1 https://github.com/libsdl-org/SDL.git
        cd SDL
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel
        sudo cmake --install build

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        choco install cmake ninja --no-progress

    - name: Configure CMake
      # On Windows all dependencies are fetched via FetchContent (SDL3, Lua, Box2D, sol2).
      # System SDL3/Lua/Box2D are not expected to be present, so disable system lookups.
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
          -DLUMINA_USE_SYSTEM_SDL3=OFF `
          -DLUMINA_USE_SYSTEM_LUA=OFF `
          -DLUMINA_USE_SYSTEM_BOX2D=OFF

    - name: Build
      run: cmake --build build --parallel
